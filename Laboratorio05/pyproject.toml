[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab05-duckdb-sqlite"
version = "0.1.0"
description = "LAB05 - Experimento controlado DuckDB x SQLite (TPC-H OLAP + OLTP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "apsw",
    "pandas",
    "scipy",
    "numpy",
    "matplotlib",
    "pyyaml",
    "psutil",
    "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bench*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
